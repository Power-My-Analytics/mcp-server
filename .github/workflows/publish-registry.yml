# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# whenever a version tag such as v1.0.2 is pushed.
#
# One-time setup: add the registry signing key (hex) as the repository secret
# MCP_PRIVATE_KEY. It must match the TXT record on powermyanalytics.com:
#   v=MCPv1; k=ed25519; p=<public key>
#
# Release steps: bump "version" in server.json, add a CHANGELOG entry,
# commit, then: git tag v1.0.2 && git push origin v1.0.2

name: Publish to MCP Registry

on:
  push:
    tags: ['v*']

# The job holds the registry signing key and needs nothing from GitHub but the code.
permissions:
  contents: read

env:
  # Pinned so a new upstream release cannot change what runs with the key.
  # To upgrade, take both values from the release's registry_<version>_checksums.txt.
  PUBLISHER_VERSION: v1.8.6
  PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Check tag matches server.json version
        run: |
          FILE_VERSION=$(jq -r .version server.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match server.json version $FILE_VERSION"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in with DNS key
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain powermyanalytics.com --private-key "$MCP_PRIVATE_KEY"

      - name: Publish
        run: ./mcp-publisher publish
